rules:
  # Missing domain/path/expiry are valid defaults, not standalone vulnerabilities.
  - id: express-cookie-session-default-name
    message: The default session cookie name may identify the middleware in use. This is an informational hardening observation, not evidence of an exploitable vulnerability.
    severity: INFO
    languages: [javascript, typescript]
    metadata:
      category: security
      technology: [express]
      confidence: MEDIUM
      references: ['https://expressjs.com/en/resources/middleware/session/']
    patterns:
      - pattern-either:
          - pattern-inside: |
              $SESSION = require('express-session');
              ...
          - pattern-inside: |
              $SESSION = require('cookie-session');
              ...
      - pattern: $SESSION({...})
      - pattern-not: |
          $SESSION({..., name: $NAME, ...})

  - id: express-session-httponly-disabled
    message: Session cookies explicitly disable httpOnly, allowing client-side JavaScript to read them. Review whether this is necessary; session cookies should normally use httpOnly true.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      category: security
      technology: [express]
      confidence: HIGH
      references: ['https://expressjs.com/en/resources/middleware/session/', 'https://expressjs.com/en/resources/middleware/cookie-session/']
    pattern-either:
      - patterns:
          - pattern-inside: |
              $SESSION = require('express-session');
              ...
          - pattern: |
              $SESSION({..., cookie: {..., httpOnly: false, ...}, ...})
      - patterns:
          - pattern-inside: |
              $SESSION = require('express-session');
              ...
          - pattern-inside: |
              $OPTIONS = {..., cookie: {..., httpOnly: false, ...}, ...};
              ...
          - pattern: $SESSION($OPTIONS)
      - patterns:
          - pattern-inside: |
              $SESSION = require('cookie-session');
              ...
          - pattern: |
              $SESSION({..., httpOnly: false, ...})
      - patterns:
          - pattern-inside: |
              $SESSION = require('cookie-session');
              ...
          - pattern-inside: |
              $OPTIONS = {..., httpOnly: false, ...};
              ...
          - pattern: $SESSION($OPTIONS)

  - id: express-session-secure-disabled
    message: Session cookies explicitly disable secure, so the cookie setting does not restrict transmission to HTTPS. Review the deployment and enable secure cookies for production HTTPS.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      category: security
      technology: [express]
      confidence: HIGH
      references: ['https://expressjs.com/en/resources/middleware/session/', 'https://expressjs.com/en/resources/middleware/cookie-session/']
    pattern-either:
      - patterns:
          - pattern-inside: |
              $SESSION = require('express-session');
              ...
          - pattern: |
              $SESSION({..., cookie: {..., secure: false, ...}, ...})
      - patterns:
          - pattern-inside: |
              $SESSION = require('express-session');
              ...
          - pattern-inside: |
              $OPTIONS = {..., cookie: {..., secure: false, ...}, ...};
              ...
          - pattern: $SESSION($OPTIONS)
      - patterns:
          - pattern-inside: |
              $SESSION = require('cookie-session');
              ...
          - pattern: |
              $SESSION({..., secure: false, ...})
      - patterns:
          - pattern-inside: |
              $SESSION = require('cookie-session');
              ...
          - pattern-inside: |
              $OPTIONS = {..., secure: false, ...};
              ...
          - pattern: $SESSION($OPTIONS)

  - id: express-session-secure-not-configured
    message: No explicit secure cookie setting was found in these literal express-session options. Its default does not require HTTPS. Review production configuration; this observation alone does not prove a deployed vulnerability.
    severity: INFO
    languages: [javascript, typescript]
    metadata:
      category: security
      technology: [express]
      confidence: MEDIUM
      references: ['https://expressjs.com/en/resources/middleware/session/']
    patterns:
      - pattern-inside: |
          $SESSION = require('express-session');
          ...
      - pattern: $SESSION({...})
      - pattern-not: |
          $SESSION({..., cookie: {..., secure: $VALUE, ...}, ...})
