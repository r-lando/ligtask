rules:
- id: insecure-document-method
  message: >-
    User controlled data in methods like `innerHTML`, `outerHTML` or `document.write` is an anti-pattern
    that can lead to XSS vulnerabilities
  metadata:
    cwe:
    - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
    owasp:
    - A07:2017 - Cross-Site Scripting (XSS)
    - A03:2021 - Injection
    - A05:2025 - Injection
    category: security
    technology:
    - browser
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - audit
    likelihood: LOW
    impact: LOW
    confidence: LOW
    references:
    - https://owasp.org/Top10/A03_2021-Injection
  languages:
  - javascript
  - typescript
  severity: ERROR
  patterns:
  - pattern-either:
    - pattern: |
        $EL.innerHTML = $HTML;
    - pattern: |
        $EL.outerHTML = $HTML;
    - pattern: document.write(...)
  - pattern-not: |
      $EL.innerHTML = "...";
  - pattern-not: |
      $EL.outerHTML = "...";
  - pattern-not: document.write("...")
  - pattern-not: |
      $EL.innerHTML = "..." || "...";
  - pattern-either:
    - patterns:
      - pattern-either:
        - pattern: $EL.innerHTML = $HTML;
        - pattern: $EL.outerHTML = $HTML;
        - pattern: document.write(...);
      - pattern-not: $EL.innerHTML = $PURIFY.sanitize($INPUT);
      - pattern-not: $EL.outerHTML = $PURIFY.sanitize($INPUT);
      - pattern-not: document.write($PURIFY.sanitize($INPUT));
    - patterns:
      - pattern-either:
        - pattern: $EL.innerHTML = $PURIFY.sanitize($INPUT);
        - pattern: $EL.outerHTML = $PURIFY.sanitize($INPUT);
        - pattern: document.write($PURIFY.sanitize($INPUT));
      - pattern-not-inside: |
          import $PURIFY from 'dompurify';
          ...
    - pattern-inside: |
        ...
        $PURIFY.setConfig(...);
        ...
    - pattern-inside: |
        ...
        $PURIFY.addHook(...);
        ...
    - patterns:
      - pattern-either:
        - pattern: $EL.innerHTML = $PURIFY.sanitize($INPUT);
        - pattern: $EL.outerHTML = $PURIFY.sanitize($INPUT);
        - pattern: document.write($PURIFY.sanitize($INPUT));
      - pattern-inside: |
          function ...(..., $PURIFY, ...) { ... }
    - patterns:
      - pattern-either:
        - pattern: $EL.innerHTML = $PURIFY.sanitize($INPUT);
        - pattern: $EL.outerHTML = $PURIFY.sanitize($INPUT);
        - pattern: document.write($PURIFY.sanitize($INPUT));
      - pattern-inside: |
          (..., $PURIFY, ...) => { ... }
    - patterns:
      - pattern-either:
        - pattern: $EL.innerHTML = $PURIFY.sanitize($INPUT);
        - pattern: $EL.outerHTML = $PURIFY.sanitize($INPUT);
        - pattern: document.write($PURIFY.sanitize($INPUT));
      - pattern-either:
        - pattern-inside: |
            ...
            const $PURIFY = $LOCAL;
            ...
        - pattern-inside: |
            ...
            let $PURIFY = $LOCAL;
            ...
        - pattern-inside: |
            ...
            var $PURIFY = $LOCAL;
            ...
    - pattern-inside: |
        ...
        $PURIFY.sanitize = $REPLACEMENT;
        ...
