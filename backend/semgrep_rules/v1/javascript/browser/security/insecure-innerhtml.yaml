rules:
- id: insecure-innerhtml
  message: >-
    User controlled data in a `$EL.innerHTML` is an anti-pattern that can lead to XSS vulnerabilities
  metadata:
    cwe:
    - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
    owasp:
    - A07:2017 - Cross-Site Scripting (XSS)
    - A03:2021 - Injection
    - A05:2025 - Injection
    category: security
    technology:
    - browser
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - audit
    likelihood: LOW
    impact: LOW
    confidence: LOW
    references:
    - https://owasp.org/Top10/A03_2021-Injection
  languages:
  - javascript
  - typescript
  severity: ERROR
  patterns:
  - pattern: |
      $EL.innerHTML = $HTML;
  - pattern-not: |
      $EL.innerHTML = "...";
  - pattern-not: |
      $EL.innerHTML = "..." || "...";
  - pattern-either:
    - patterns:
      - pattern: $EL.innerHTML = $HTML;
      - pattern-not: $EL.innerHTML = $PURIFY.sanitize($INPUT);
    - patterns:
      - pattern: $EL.innerHTML = $PURIFY.sanitize($INPUT);
      - pattern-not-inside: |
          import $PURIFY from 'dompurify';
          ...
    - pattern-inside: |
        ...
        $PURIFY.setConfig(...);
        ...
    - pattern-inside: |
        ...
        $PURIFY.addHook(...);
        ...
    - patterns:
      - pattern: $EL.innerHTML = $PURIFY.sanitize($INPUT);
      - pattern-inside: |
          function ...(..., $PURIFY, ...) { ... }
    - patterns:
      - pattern: $EL.innerHTML = $PURIFY.sanitize($INPUT);
      - pattern-inside: |
          (..., $PURIFY, ...) => { ... }
    - pattern-inside: |
        ...
        $PURIFY.sanitize = $REPLACEMENT;
        ...
